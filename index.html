<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerodha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Londrina+Sketch&family=Protest+Strike&display=swap" rel="stylesheet">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <nav class="navbar">
            <img src="./zerodha-logo.svg" alt="">
            <div class="menu">
                <button class="nav-buttons">Signup</button>
                <button class="nav-buttons">About</button>
                <button class="nav-buttons">Products</button>
                <button class="nav-buttons">Pricing</button>
                <button class="nav-buttons">Support</button>
                <button class="nav-icon"><i class="ri-menu-line"></i></button>
            </div>
        </nav>
        <div class="line"></div>
        <div class="center-image">
            <img src="./zerodha-landing.png" alt="">
        </div>
        <div class="text">
            <h1><span>Invest in</span> everything</h1>
            <h2><span class="span-1">Online platform to invest in</span> <span class="span-2">stocks, derivatives, mutual funds,</span> <span class="span-3">ETFs, bonds, and more.</span></h2>
        </div>
        <div class="signup">
            <button class="signup-button">Sign up for free</button>
        </div>
    </div>
</body>
</html>
